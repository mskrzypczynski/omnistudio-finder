name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Kit check (src/kit is the synced copy, not edited by hand)
        run: npm run kit:check
      - run: npm test
      - name: Package (also verifies manifest and package versions match)
        run: npm run package
